<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#3b42f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient (Indigo to Teal) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b42f6" />
      <stop offset="50%" stop-color="#47bfff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Math Symbol Gradient -->
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <!-- Hour Hand Gradient -->
    <linearGradient id="hourGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#47bfff" />
    </linearGradient>

    <!-- Minute Hand Gradient -->
    <linearGradient id="minGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Outer Stopwatch Case Ring -->
  <circle cx="256" cy="256" r="185" stroke="url(#ringGrad)" stroke-width="20" fill="none" filter="url(#glow)" />

  <!-- Stopwatch Top Crown -->
  <path d="M 236 46 h 40 v 26 h -40 z" fill="#3b42f6" />
  <path d="M 216 72 h 80 v 8 h -80 z" fill="#47bfff" />
  
  <!-- Stopwatch Side Pusher (at 45deg) -->
  <g transform="rotate(45 256 256)">
    <path d="M 241 46 h 30 v 26 h -30 z" fill="#10b981" />
  </g>

  <!-- Inner Watch Face -->
  <circle cx="256" cy="256" r="148" stroke="#1e293b" stroke-width="6" fill="#0b0f19" />

  <!-- ── Calculation Operator Markers (Ticks) ── -->
  <!-- 12 O'Clock: Plus (+) -->
  <path d="M 256 94 v 24 M 244 106 h 24" stroke="url(#mathGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- 3 O'Clock: Minus (-) -->
  <path d="M 390 256 h 20" stroke="url(#mathGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- 6 O'Clock: Multiply (×) -->
  <path d="M 248 398 l 16 16 M 264 398 l -16 16" stroke="url(#mathGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- 9 O'Clock: Equals (=) -->
  <path d="M 98 251 h 20 M 98 261 h 20" stroke="url(#mathGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Subtle grid pattern in the face representing calculation/ledger sheet -->
  <path d="M 200 170 v 172 M 256 170 v 172 M 312 170 v 172 M 170 200 h 172 M 170 256 h 172 M 170 312 h 172" 
        stroke="#1e293b" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" />

  <!-- ── Clock / Duration Hands ── -->
  <!-- Hour hand (points towards 10) -->
  <g transform="rotate(-60 256 256)">
    <line x1="256" y1="256" x2="256" y2="170" stroke="url(#hourGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Minute hand (points towards 2) -->
  <g transform="rotate(60 256 256)">
    <line x1="256" y1="256" x2="256" y2="130" stroke="url(#minGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Second hand (orange stopwatch hand pointing to ~5) -->
  <g transform="rotate(150 256 256)">
    <line x1="256" y1="280" x2="256" y2="120" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <circle cx="256" cy="120" r="6" fill="#f97316" />
  </g>

  <!-- Center Pin cap -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="6" fill="#3b42f6" />
</svg>